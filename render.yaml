services:
  - type: web
    name: dontsuckatfantasydrafts-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm install --prefix server --include=dev && npm run build --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /opt/render/project/src/data
