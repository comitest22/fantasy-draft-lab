name: Weekly enrichment

on:
  schedule:
    - cron: '0 15 * * 2'
    - cron: '0 15 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Refresh enrichment
        env:
          POOLGENIUS_USERNAME: ${{ secrets.POOLGENIUS_USERNAME }}
          POOLGENIUS_PASSWORD: ${{ secrets.POOLGENIUS_PASSWORD }}
        run: npm run enrichment:weekly

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/enrichment
          if git diff --cached --quiet; then
            echo "No enrichment changes"
          else
            git commit -m "chore: refresh 2026 enrichment"
            git push
          fi
